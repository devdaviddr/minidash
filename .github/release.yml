# How GitHub groups auto-generated release notes. Pull requests are grouped by the labels that
# pr-labels.yml adds from their Conventional Commit titles.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature]
    - title: Fixes
      labels: [fix]
    - title: Performance
      labels: [performance]
    - title: Refactoring
      labels: [refactor]
    - title: Documentation
      labels: [documentation]
    - title: Tests and CI
      labels: [test, ci]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
