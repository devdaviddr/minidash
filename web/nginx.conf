server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Stored history, proxied to the agent so the browser fetches it same-origin: the CSP only allows
  # 'self' plus WebSockets, and the HTTPS path has no agent port to talk to (ADR 0016).
  location /history {
    include /etc/nginx/security-headers.inc;
    proxy_pass http://host.containers.internal:8787;
    proxy_pass_request_headers on;
  }
  location /assets/ {
    include /etc/nginx/security-headers.inc;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    include /etc/nginx/security-headers.inc;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
