name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Spec tool runs and a current version exists
        run: python3 -I tools/sdd/scripts/spec_tool.py list
      - name: Approved spec has no open questions
        run: |
          cur=$(ls spec | sort -V | tail -1)
          if grep -q '^status: *\(approved\|implemented\)' "spec/$cur/spec.md" && grep -v '^>' "spec/$cur/spec.md" | grep -q '\[NEEDS INPUT'; then
            echo "Approved spec $cur still has [NEEDS INPUT] markers"; exit 1
          fi
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+' || { echo "Bad PR title: $TITLE"; exit 1; }
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: agent/go.mod }
      - run: cd agent && go vet ./... && go test ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run lint && npm test && npm run build
