server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    include /etc/nginx/security-headers.inc;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    include /etc/nginx/security-headers.inc;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
